name: VIX 期限倒挂报警

on:
  repository_dispatch:
    types: [vix-alarm]
  workflow_dispatch: {}

jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests

      - name: 运行VIX报警
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python alarm_vix.py
